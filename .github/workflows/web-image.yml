name: Build & Push Kartenbot-Web Image

# Baut das Container-Abbild fuer die Website (web/). Laeuft nur, wenn sich dort
# oder an den Bot-Modulen etwas aendert, die mit hineinkopiert werden.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'karten.py'
      - 'items.py'
      - 'services/card_variants.py'
      - 'services/__init__.py'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read web version
        id: version
        run: echo "value=$(cat web/VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: web/Dockerfile
          push: true
          tags: |
            ghcr.io/bastild/kartenbot-web:latest
            ghcr.io/bastild/kartenbot-web:${{ steps.version.outputs.value }}
